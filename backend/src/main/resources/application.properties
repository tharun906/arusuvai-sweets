spring.application.name=backend
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

google.client-id=1068888337588-qtvvd5nj7r8jr8bhi6pgc2de510uqj1t.apps.googleusercontent.com

razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}

#RAZORPAY_WEBHOOK_SECRET is not your Razorpay key secret.
#Razorpay specifically uses a separate webhook secret for webhook signature validation.